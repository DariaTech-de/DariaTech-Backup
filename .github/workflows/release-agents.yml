name: Release agents
# Builds and tests every agent package, then publishes them together as one GitHub release.
# The Console reads agent-release.json from the latest release to offer downloads per platform.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Only for testing - publish as a pre-release instead of the production release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-agents
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Only master is releasable
        if: github.ref != 'refs/heads/master'
        run: |
          echo "Agent releases are built from master only." >&2
          exit 1
      - id: version
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as E;print(E.parse('DariaTech/Agent/DariaTech.Agent.csproj').findtext('./PropertyGroup/Version'))")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid agent version $version" >&2; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/agent-v$version" >/dev/null; then echo "agent-v$version already exists; raise <Version> in DariaTech.Agent.csproj" >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  windows:
    needs: guard
    permissions:
      contents: write
    uses: ./.github/workflows/windows-installer.yml
  unix:
    needs: guard
    uses: ./.github/workflows/unix-agent.yml
  publish:
    needs: [guard, windows, unix]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.guard.outputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Assemble release assets with stable names and a manifest
        run: python3 scripts/assemble-agent-release.py downloaded release "$VERSION" "${{ github.repository }}"
      - name: Publish release
        run: |
          flags=(--target "$GITHUB_SHA" --title "DariaTech Backup Agent $VERSION" --notes-file RELEASE_NOTES.md)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "agent-v$VERSION" release/* "${flags[@]}"
